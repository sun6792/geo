# GEO AI Platform — Nginx Configuration
upstream backend_api {
    server backend:8000;
}

upstream frontend_app {
    server frontend:80;
}

server {
    listen 80;
    server_name _;

    # Frontend SPA — serve static files
    location / {
        proxy_pass http://frontend_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API — proxy to FastAPI
    location /api/ {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # API docs
    location /api/docs {
        proxy_pass http://backend_api/api/docs;
        proxy_set_header Host $host;
    }

    location /api/redoc {
        proxy_pass http://backend_api/api/redoc;
        proxy_set_header Host $host;
    }

    location /api/openapi.json {
        proxy_pass http://backend_api/api/openapi.json;
        proxy_set_header Host $host;
    }

    # Uploaded file access
    location /uploads/ {
        alias /data/uploads/;
    }
}
